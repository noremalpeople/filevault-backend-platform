spring:
  application:
    name: filevault
  datasource:
    url: "jdbc:mysql://127.0.0.1:${FILEVAULT_DB_PORT:3308}/filevault_dev?connectionTimeZone=UTC&connectTimeout=3000&socketTimeout=5000"
    username: ${FILEVAULT_DB_USER:filevault_app}
    password: "${FILEVAULT_DB_PASSWORD}"
    hikari:
      maximum-pool-size: 8
      connection-timeout: 4000
      connection-init-sql: "SET time_zone = '+00:00'"
  flyway:
    clean-disabled: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 0B
server:
  address: 127.0.0.1
  port: ${FILEVAULT_PORT:8082}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
filevault:
  web-root: "${FILEVAULT_WEB_ROOT:classpath:/static/}"
  storage-root: "${FILEVAULT_STORAGE_ROOT:../.local/storage}"
  max-upload-bytes: "${FILEVAULT_MAX_UPLOAD_BYTES:209715200}"
  user-object-quota-bytes: "${FILEVAULT_USER_OBJECT_QUOTA_BYTES:536870912}"
  user-upload-reservation-bytes: "${FILEVAULT_USER_UPLOAD_RESERVATION_BYTES:838860800}"
  max-open-uploads: "${FILEVAULT_MAX_OPEN_UPLOADS:4}"
  storage-min-free-bytes: "${FILEVAULT_STORAGE_MIN_FREE_BYTES:268435456}"
  storage-staging-bytes: "${FILEVAULT_STORAGE_STAGING_BYTES:1073741824}"
  cleanup-delay-ms: "${FILEVAULT_CLEANUP_DELAY_MS:60000}"
  cleanup-retry-seconds: "${FILEVAULT_CLEANUP_RETRY_SECONDS:300}"
  reconcile-grace-seconds: "${FILEVAULT_RECONCILE_GRACE_SECONDS:900}"
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
