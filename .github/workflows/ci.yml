name: FileVault CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Java 21 build and database-independent tests
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      FILEVAULT_IT: 'false'
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: .\mvnw.cmd --batch-mode clean verify

  frontend:
    name: Node 24 tests and production build
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm.cmd ci
      - run: npm.cmd test
      - run: npm.cmd run build
